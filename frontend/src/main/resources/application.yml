server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      persistent: false
  ssl:
    enabled: true
    bundle: "frontend-https" # Имя бандла ниже

spring:
  ssl:
    bundle:
      pem:
        backend-trust: # Имя бандла
          truststore:
            certificate: "${SSL_CERT_PATH:file:./.secrets/server.crt}"
        frontend-https:
          keystore:
            certificate: "${SSL_CERT_PATH:file:./.secrets/server.crt}"
            private-key: "${SSL_KEY_PATH:file:./.secrets/server.key}"
  grpc:
    client:
      channel:
        backend-service:
          target: static://${BACKEND_HOST:localhost}:${BACKEND_PORT:9091}
          ssl:
            enabled: true
            bundle: "backend-trust" # Ссылка на имя бандла выше
            # authority-override: localhost

logging:
  level:
    com.example.vsd.frontend: info
#    com.vaadin.flow.server.auth: debug
#    org.springframework.security: debug
#    io.grpc: debug
#    io.grpc.netty: debug
