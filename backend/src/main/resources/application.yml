spring:
  application:
    name: vsd-backend
  main:
    log-startup-info: false
  output:
    ansi:
      enabled: ALWAYS
  jackson:
    serialization:
      INDENT_OUTPUT: true

  grpc:
    server:
      port: 9091
      health:
        enabled: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/service-desk?currentSchema=sd
    username: ${DB_USER:dbuser}
    password: ${DB_PASSWORD:12345}

  jpa:
    hibernate:
      ddl-auto: validate
#    show-sql: true
    properties:
      hibernate:
        default_schema: sd
#        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: sd
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0

  sql:
    init:
      mode: never

logging:
  level:
    com.example.vsd.manager: debug
    org:
      springframework: info
