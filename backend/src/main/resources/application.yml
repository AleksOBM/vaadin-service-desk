spring:
  application:
    name: vsd-backend
  main:
    log-startup-info: false
  output:
    ansi:
      enabled: always
  jackson:
    serialization:
      INDENT_OUTPUT: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}

  grpc:
    server:
      port: 9091
      health:
        enabled: true
      ssl:
        enabled: true
        bundle: "grpc-server"

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/service-desk?currentSchema=sd
    username: ${DB_USER:dbuser}
    password: ${DB_PASSWORD:12345}

  jpa:
    hibernate:
      ddl-auto: validate
#    show-sql: true
    properties:
      hibernate:
        default_schema: sd
#        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: sd
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0

  sql:
    init:
      mode: never

  ssl:
    bundle:
      pem:
        grpc-server:
          keystore:
            certificate: "${SSL_CERT_PATH:file:./.secrets/server.crt}"
            private-key: "${SSL_KEY_PATH:file:./.secrets/server.key}"

security:
  jwt:
    # TODO: remove default before prod, pass via env JWT_SECRET
    secret: ${JWT_SECRET:wX5uIrf5Y7y47tUyftfVbFV5lfXyA/D+G4yh5le9m6c=}
  mail:
    # TODO: remove default before prod, pass via env MAIL_ENCRYPTION_KEY
    encryption-key: ${MAIL_ENCRYPTION_KEY:9fK2mQ7vX1pL4sR8tY6nB3cD5hJ0aZ2wE7uI9oP1kM8=}

vsd:
  admin:
    password: ${ADMIN_PASSWORD:admin}

logging:
  level:
    com.example.vsd.manager: info
    org:
      springframework: info
#      springframework.grpc: debug
#    io.grpc: debug
