volumes:
  vsd_db_data:

services:
  db:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=service-desk
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=12345
    volumes:
#      - ./docker-init.sql:/docker-entrypoint-initdb.d/docker-init.sql:ro
      - vsd_db_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "9091:9091"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - SQL_INIT_MODE=never
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/service-desk
      - SPRING_DATASOURCE_USERNAME=dbuser
      - SPRING_DATASOURCE_PASSWORD=12345
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:9091"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=9091
      - SERVER_PORT=8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s