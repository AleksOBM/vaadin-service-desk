volumes:
  vsd_db_data:
  vsd_serts:

services:

  cert-generator:
    image: alpine/openssl:3.3.2
    entrypoint: /bin/sh
    volumes:
      - vsd_serts:/certs
      - ./gen-certs.sh:/gen-certs.sh:ro
    command: /gen-certs.sh
    restart: "no"

  db:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=service-desk
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=12345
    volumes:
      - vsd_db_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "9091:9091"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - SQL_INIT_MODE=never
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/service-desk
      - SPRING_DATASOURCE_USERNAME=dbuser
      - SPRING_DATASOURCE_PASSWORD=12345
      - SSL_CERT_PATH=file:/app/.secrets/server.crt
      - SSL_KEY_PATH=file:/app/.secrets/server.key
    volumes:
      - vsd_serts:/app/.secrets:ro
    depends_on:
      db:
        condition: service_healthy
      cert-generator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:9091", "-tls", "-tls-no-verify"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=9091
      - SERVER_PORT=8080
      - SSL_CERT_PATH=file:/app/.secrets/server.crt
      - SSL_KEY_PATH=file:/app/.secrets/server.key
    volumes:
      - vsd_serts:/app/.secrets:ro
    depends_on:
      backend:
        condition: service_healthy
      cert-generator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s