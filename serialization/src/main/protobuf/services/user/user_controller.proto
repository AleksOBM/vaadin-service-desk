syntax = "proto3";

package sd.services;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "messages/manager_messages.proto";

option java_multiple_files = true;
option java_package = "com.example.vsd.grpc.services.user";
option java_outer_classname = "UserControllerProto";

service UserController {
  rpc saveOrder (sd.messages.OrderProto) returns (google.protobuf.Empty);
  rpc setOrderDeleted (google.protobuf.Int64Value) returns (google.protobuf.Empty);
}