syntax = "proto3";

package sd.services;

import "messages/manager_messages.proto";

option java_multiple_files = true;
option java_package = "com.example.vsd.grpc.services.free";
option java_outer_classname = "FreeControllerProto";

service FreeController {
  rpc login(sd.messages.LoginRequest) returns (sd.messages.LoginResponse);
}