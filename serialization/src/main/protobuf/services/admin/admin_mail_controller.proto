syntax = "proto3";

package sd.services;

import "google/protobuf/empty.proto";
import "messages/manager_messages.proto";

option java_multiple_files = true;
option java_package = "com.example.vsd.grpc.services.admin";
option java_outer_classname = "AdminMailControllerProto";

service AdminMailController {
  rpc getMailConfig (google.protobuf.Empty) returns (sd.messages.GetMailConfigResponse);
  rpc updateConfig (sd.messages.UpdateConfigRequest) returns (sd.messages.UpdateConfigResponse);
}
